<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Blog Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <style>
        body{
            margin: 0;
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center; /* Horizontal center */
            align-items: center;     /* Vertical center */
        }

        .container {
            background-color: #FFFFFF; /* Example background color */
            width: 350px; /* Example width */
            height: 365px; /* Example height */
            border-radius: 15px; /* This creates the rounded corners */
            padding: 20px; /* Example padding */
            /* text-align: center; */
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        }

        img{
            border-radius: 15px;
            display: block;
            margin: 0 auto;
        }

        h1{
            font-family: "Sora", sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-align: left;
            margin-left: 7px;
        }

        p{
            font-family: "Sora", sans-serif;
            color: #394150;
            font-size: 14px;
            font-weight: 300;
            text-align: left;
            margin-left: 7px;
            max-width: 330px;
            line-height: 1.5;
        }

        .small-text{
            font-family: "Sora", sans-serif;
            color: #394150;
            font-size: 12px;
            font-weight: 400;
            text-align: left;
            margin-left: 7px;
        }

        .line {
            width: calc(100% + 20px); /* 40px = left + right padding of .container */
            height: 1px;
            background-color: #E5EAF0;
            margin: 0 -20px; /* push it into the padding */
            margin: 25px 0;
        }
        
        button{
            background-color: #F2EAFD;
            font-family: "Sora", sans-serif;
            color: #7C19EE;
            font-size: 10px;
            font-weight: 600;
            border-radius: 15px;
            border: none;         /* removes default border */
            box-shadow: none;     /* ensures no shadow */
            padding: 6px 14px;    /* adjust size */
            display: inline-block; 
            margin-left: 7px;     /* optional, to align with text margin */
        }
        
    </style>
</head>
<body>
    <div class="container">
        <img src="/resources/Cactus.jpg" alt="cactus">
        <h1>Embracing Minimalism</h1>
        <button>Design</button>
        <p>From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.</p>
        <div class="line"></div>
        <p class="small-text">Annie Spratt</p>
    </div>
    
    
</body>
</html>
